<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app (Add to Home Screen). `use-credentials` so the manifest request carries cookies
         when an auth proxy (e.g. Cloudflare Access) sits in front of Watchtower. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- iOS ignores the manifest's icons and needs its own; full-bleed, iOS rounds the corners itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Watchtower" />
    <!-- Content runs under the status bar; the mobile header pads itself by the safe-area inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Watchtower</title>
    <script>
      // Pre-paint theme boot — sets .dark on <html> before first paint (no FOUC).
      // Reads localStorage 'wt-theme' ('light' | 'dark' | 'system' | null => system).
      (function () {
        try {
          var stored = localStorage.getItem('wt-theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
