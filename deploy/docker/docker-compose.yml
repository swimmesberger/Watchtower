# Example Watchtower deployment.
#
# Watchtower talks to the host Docker daemon to inspect containers and run `docker compose`
# for your stacks, so it needs the Docker socket mounted and permission to use it.
#
#   1. Find the host's docker group GID:  getent group docker | cut -d: -f3
#   2. Put that value in `group_add` below.
#   3. docker compose up -d
#
# The UI is served on http://localhost:8080 — the management plane, published on the loopback interface
# below. Put it behind an authenticating reverse proxy (e.g. Cloudflare Access, Authelia) — Watchtower
# itself has no built-in authentication unless you enable it.
#
# Built-in reverse proxy (optional): set WATCHTOWER__PROXY__ENABLED=true and Watchtower terminates TLS
# in its own process, routing the domains you add under "Routes" to services inside your stacks over
# private per-stack networks. There is no second container and no control network. Requirements when
# enabled:
#   * uncomment the 80:8081 and 443:8443 port mappings below. Port 80 is not optional: ACME HTTP-01
#     validation is how certificates are issued, and the CA reaches it over plain HTTP.
#   * ingress (8081/8443) and the management plane (8080) are separate listeners. A request on an
#     ingress port whose Host is not a route — or a realm login host — is answered with 404 and never
#     reaches Watchtower's UI or API.
#   * point each route's DNS at this host before adding it, so the first issuance can validate.
#   * set WATCHTOWER__PROXY__ADMINEMAIL for Let's Encrypt expiry notices (recommended).
# Certificates and the ACME account key are written to /data/proxy-certs, so they persist in the data
# volume below — nothing else to declare. An internal CA (step-ca, ZeroSSL, …) works too: set
# WATCHTOWER__PROXY__YARP__ACMEDIRECTORYURL, plus __ACMECABUNDLEPATH for its root and the EAB pair if
# it requires one. See docs/reverse-proxy/yarp.md.
# Two other providers exist: `caddy` (a sibling Caddy container holding the host's ports 80/443) is
# DEPRECATED and kept for existing installs — docs/reverse-proxy/caddy.md; `cloudflare` routes through
# a Cloudflare Tunnel and needs no open ports at all — docs/reverse-proxy/cloudflare.md.
# Leave the flag unset to run your own proxy instead. Start at docs/reverse-proxy/README.md.
services:
  watchtower:
    image: swimmes/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    ports:
      # The management plane: Watchtower's own UI and API. Bound to the loopback interface, because this
      # port answers for every Host name and is the process holding the Docker socket, the database and
      # every credential. Reach it over a VPN or an SSH tunnel; to reach the UI from the internet, enable
      # authentication, set WATCHTOWER__AUTH__HOST to a hostname you control and use the 443 mapping
      # below — that login host is the one name ingress will serve Watchtower itself on.
      - "127.0.0.1:8080:8080"
      # Built-in reverse proxy (opt-in): publish the ingress ports — 80 must be reachable for ACME
      # HTTP-01, 443 carries the routed traffic. These are separate container ports from 8080 on purpose:
      # an unknown Host arriving here gets a 404 rather than Watchtower's management plane.
      # - "80:8081"
      # - "443:8443"
      # The container's own ports are set by Kestrel__Endpoints__Http__Url (8080),
      # Kestrel__Endpoints__ProxyHttp__Url (8081) and Kestrel__Endpoints__ProxyHttps__Url (8443);
      # ASPNETCORE_URLS no longer applies to this image.
    volumes:
      - watchtower-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: expose the host's docker credentials for private image pulls.
      # - ${HOME}/.docker/config.json:/home/watchtower/.docker/config.json:ro
      # Optional: host CPU/RAM/load on the Dashboard (opt-in) — see docs/host-metrics.md.
      # - /proc:/host/proc:ro
    environment:
      WATCHTOWER__DBPATH: /data/watchtower.db
      WATCHTOWER__DOCKERAPIVERSION: "1.43"
      # Enable the background "update available" checkers (opt-in — generate registry traffic):
      # WATCHTOWER__AUTOCHECKENABLED: "true"
      # WATCHTOWER__STACKCHECKENABLED: "true"
      # Built-in reverse proxy (opt-in) — needs the 80:8081 / 443:8443 port mappings above.
      # WATCHTOWER__PROXY__ENABLED: "true"
      # WATCHTOWER__PROXY__ADMINEMAIL: you@example.com
      # WATCHTOWER__PROXY__PROVIDER: yarp   # yarp (default) | caddy (deprecated) | cloudflare
      # WATCHTOWER__PROXY__YARP__ACMEDIRECTORYURL: https://acme-v02.api.letsencrypt.org/directory
      # Host metrics (opt-in) — needs the /proc mount above; see docs/host-metrics.md.
      # WATCHTOWER_HOST_PROC: /host/proc
      # Metrics history is ON by default (persisted into the data volume, ~30 days; ADR-0013).
      # Tune or switch under Settings → Metrics in the UI, or here; see docs/metrics-history.md.
      # WATCHTOWER__METRICS__BACKEND: sqlite   # sqlite (default) | memory | influxdb
      # WATCHTOWER__METRICS__RETENTIONDAYS: "30"
    # Replace 999 with the host's docker group GID (see the header comment).
    group_add:
      - "999"

volumes:
  watchtower-data:
