name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # The integration suites run against a real PostgreSQL (ADR-0024). A service container rather
      # than Testcontainers on CI: the runner already has one waiting before the first test starts, and
      # WATCHTOWER_TEST_PG below is the same override a developer uses locally when their container
      # engine is not reachable — so both paths are exercised rather than one being CI-only.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: watchtower
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # ── Backend ──
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build backend
        run: dotnet build Watchtower.slnx --configuration Release

      - name: Test backend
        # The account must be able to CREATE DATABASE: each test host gets its own, cloned from a
        # template the migrations are applied to once per assembly (PostgresTestServer).
        env:
          WATCHTOWER_TEST_PG: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=watchtower"
        run: dotnet test Watchtower.slnx --configuration Release --no-build

      - name: Verify RPC schema is up to date
        run: |
          # `dotnet run --project` runs the app with its CWD set to the project dir (via launchSettings),
          # so a RELATIVE output path lands in src/Watchtower.Api/, never the repo-root file this step
          # then diffs — which is why the check used to pass on any drift. Write to an ABSOLUTE repo-root
          # path ($PWD is the checkout root here) so the export hits the file git actually compares.
          dotnet run --project src/Watchtower.Api --configuration Release --no-build -- --export-schema "$PWD/rpc-schema.json"
          git diff --exit-code -- rpc-schema.json \
            || (echo "::error::rpc-schema.json is stale. Regenerate from the repo root: dotnet run --project src/Watchtower.Api -- --export-schema \"\$PWD/rpc-schema.json\"" && exit 1)

      # ── Frontend ──
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/watchtower-web/package-lock.json

      - name: Build frontend
        working-directory: src/watchtower-web
        run: |
          npm ci
          npm run build

  docker:
    name: Build & push image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/watchtower:latest
            ${{ vars.DOCKERHUB_USERNAME }}/watchtower:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
